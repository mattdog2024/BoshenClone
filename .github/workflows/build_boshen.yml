name: Build Boshen 波神测量 Windows EXE

# 触发方式：
# 1. 手动触发（在 GitHub 网页 Actions 页面点 "Run workflow"）
# 2. 修改了波神测量软件的源码后自动触发
on:
  workflow_dispatch:        # 允许手动点击运行
  push:
    branches:
      - main
      - genspark_ai_developer
    paths:
      - 'main.py'
      - 'overlay.py'
      - 'ui_toolbar.py'
      - 'ui_analysis.py'
      - 'ui_strategy.py'
      - 'region_manager.py'
      - 'algorithms.py'
      - 'preset_manager.py'
      - 'ocr_helper.py'
      - 'strategy_manager.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/build_boshen.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.7.2 numpy rapidocr_onnxruntime pyinstaller

      - name: Read version
        id: ver
        shell: powershell
        run: |
          # 从 version.txt 读取版本号，清掉 BOM/空白/换行
          $raw = Get-Content version.txt -Raw -ErrorAction SilentlyContinue
          if (-not $raw) { $raw = "v3.3.0" }
          $v = ($raw -replace '[^0-9A-Za-z\.\-_]', '')
          if (-not $v) { $v = "v3.3.0" }
          Write-Host "Version: $v"
          echo "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --name "BoshenKaiLine_${{ steps.ver.outputs.version }}" ^
            --add-data "config.json;." ^
            --hidden-import "PySide6.QtCore" ^
            --hidden-import "PySide6.QtGui" ^
            --hidden-import "PySide6.QtWidgets" ^
            --hidden-import "rapidocr_onnxruntime" ^
            --collect-all "rapidocr_onnxruntime" ^
            main.py

      - name: List dist
        shell: powershell
        run: |
          Get-ChildItem dist | Select-Object Name, Length | Format-Table

      - name: Create portable ZIP
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zipName = "BoshenKaiLine_$($ver)_Windows.zip"
          # 把 exe + config.json 一起打包，方便用户开箱即用
          $exe = Get-ChildItem "dist\*.exe" | Select-Object -First 1
          Compress-Archive -Path $exe.FullName, "config.json" -DestinationPath $zipName -Force
          $size = [math]::Round((Get-Item $zipName).Length / 1MB, 1)
          Write-Host "ZIP created: $zipName ($size MB)"
          echo "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoshenKaiLine-Windows-EXE
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
