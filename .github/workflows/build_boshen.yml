name: Build BoshenKaiLine Windows EXE

on:
  push:
    paths:
      - 'main.py'
      - 'ui_toolbar.py'
      - 'overlay.py'
      - 'ui_analysis.py'
      - 'algorithms.py'
      - 'ocr_helper.py'
      - 'preset_manager.py'
      - 'strategy_manager.py'
      - 'verifier.py'
      - 'boshen_tray.ico'
      - 'version.txt'
      - '.github/workflows/build_boshen.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v3.4.1)'
        required: false
        default: 'v3.4.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if (-not $tag) { $tag = "v3.4.1" }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "Version: $tag"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.7.3
          pip install rapidocr-onnxruntime
          pip install numpy
          REM v3.4.1: 不再依赖第三方 keyboard 库，改用 Windows 原生 RegisterHotKey API
          pip install pyinstaller

      - name: Verify imports
        shell: cmd
        run: |
          python -c "import PySide6; print('PySide6 OK:', PySide6.__version__)"
          python -c "from rapidocr_onnxruntime import RapidOCR; print('RapidOCR OK')"
          python -c "import numpy; print('numpy OK:', numpy.__version__)"
          python -c "import ctypes; print('ctypes OK:', ctypes.windll.user32)"

      - name: Build EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller ^
            --noconfirm ^
            --onefile ^
            --windowed ^
            --name "BoshenKaiLine_${{ steps.version.outputs.tag }}" ^
            --icon "boshen_tray.ico" ^
            --add-data "boshen_tray.ico;." ^
            --add-data "config.json;." ^
            --hidden-import="rapidocr_onnxruntime" ^
            --collect-all="rapidocr_onnxruntime" ^
            --hidden-import="PySide6.QtCore" ^
            --hidden-import="PySide6.QtGui" ^
            --hidden-import="PySide6.QtWidgets" ^
            --hidden-import="PySide6.QtNetwork" ^
            main.py

      - name: Verify EXE exists
        shell: powershell
        run: |
          $exeName = "BoshenKaiLine_${{ steps.version.outputs.tag }}.exe"
          $exePath = "dist\$exeName"
          if (Test-Path $exePath) {
            $size = [math]::Round((Get-Item $exePath).Length / 1MB, 2)
            Write-Host "EXE built successfully: $exeName ($size MB)"
          } else {
            Write-Error "EXE not found at $exePath"
            Get-ChildItem dist\ -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "波神凯线系统 ${{ steps.version.outputs.tag }}"
          body: |
            ## 波神凯线系统 ${{ steps.version.outputs.tag }}

            ### 🐛 修复
            - **修复按 `Ctrl+Alt+S` 后程序偶发崩溃退出的问题**：
              v3.4.0 用了 `keyboard` 库注册全局热键，该库依赖 Windows 低级键盘钩子
              （WH_KEYBOARD_LL），与 PySide6 事件循环不在同一线程，竞态时会让 Python
              进程直接 crash，且需要以管理员身份运行。
              v3.4.1 改用 Windows 原生 **RegisterHotKey API**（通过 ctypes 调用
              `user32.dll`），配合 `QAbstractNativeEventFilter` 在 Qt 主线程消化
              `WM_HOTKEY` 消息，完全不引入第三方钩子库。
            - **修复 `overlay.set_tool()` 在热键路径上抢焦点的问题**：
              移除 `set_tool()` 里的 `raise_()` / `activateWindow()`，避免热键触发时
              强制夺走看盘软件的 Windows 焦点。
            - **加固 `overlay.auto_calibrate_axis()`**：
              增加 `try/finally` 兜底及 `pixmap.isNull()` 防御，截屏异常时 overlay
              可见状态一定会被恢复。

            ### ✅ 改进
            - 全局热键现在**不再需要管理员权限**运行。
            - 退出会主动调用 `UnregisterHotKey` 释放资源，不会留下系统级热键残影。
            - 使用 `MOD_NOREPEAT` 标志，避免按住 Ctrl+Alt+S 时被反复触发。

            ### 使用说明
            | 操作 | 效果 |
            |------|------|
            | 双击托盘图标 | 显示/隐藏工具面板 |
            | `Ctrl+Alt+S` | 激活「单」画线工具 |
            | `Ctrl+Alt+D` | 清除所有画线 |
            | 面板「_」按钮 | 隐藏到托盘 |
            | 面板「X」按钮 | 退出程序 |

            ### 下载
            直接下载下方的 `.exe` 文件，无需安装，双击运行即可。
          files: dist/BoshenKaiLine_${{ steps.version.outputs.tag }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
